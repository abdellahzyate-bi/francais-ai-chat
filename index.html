<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Français AI Chat</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fb;font-family:Arial,sans-serif}.app{max-width:900px;margin:20px auto;padding:12px}.head{background:linear-gradient(135deg,#241c68,#7137cf);color:white;padding:28px;text-align:center;border-radius:22px 22px 0 0}.levels,.input{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:white;padding:14px;border:1px solid #e5e7eb}.level,.action{padding:10px 15px;border-radius:12px;border:1px solid #ddd;background:white;font-weight:bold;cursor:pointer}.level.active,.send{background:#5139c6;color:white}.chat{height:480px;overflow:auto;padding:16px;background:#f8f9fc;border:1px solid #e5e7eb}.msg{max-width:85%;padding:13px;margin:10px 0;border-radius:15px;line-height:1.7}.ai{background:white}.user{background:#5139c6;color:white;margin-right:auto;direction:ltr}.note{background:#fff7ed;padding:10px;margin-top:8px;border-radius:9px}#text{flex:1;min-width:200px;padding:13px;border:1px solid #ccc;border-radius:12px;font-size:16px;direction:ltr}.status{text-align:center;padding:10px;color:#667085;font-size:13px}@media(max-width:600px){.app{margin:0;padding:0}.chat{height:440px}.head{border-radius:0}}</style></head><body><main class="app"><div class="head"><h1>🤖 Français AI</h1><p>تحدث بالفرنسية وطوّر مستواك</p></div><div class="levels"><span>مستواي:</span><button class="level active" data-l="A1">A1</button><button class="level" data-l="A2">A2</button><button class="level" data-l="B1">B1</button><button class="level" data-l="B2">B2</button><button class="level" data-l="C1">C1</button></div><div id="chat" class="chat"><div class="msg ai">🇫🇷 <b>Bonjour ! 👋</b><br>Écris-moi une phrase en français.<div class="note">🇦🇪 اكتب جملة بالفرنسية لتجربة الكتابة والإرسال.</div></div></div><div class="input"><button id="mic" class="action">🎤</button><input id="text" placeholder="Écrivez votre message en français..."><button id="send" class="action send">إرسال ➤</button></div><div class="status">نسخة اختبار للواجهة — سيتم ربط الذكاء الاصطناعي لاحقًا عبر خادم آمن.</div></main><script>let level="A1";const chat=document.getElementById("chat"),inp=document.getElementById("text");document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");level=b.dataset.l});function add(t,c){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function send(){let t=inp.value.trim();if(!t)return;add(t,"user");inp.value="";setTimeout(()=>{let d=document.createElement("div");d.className="msg ai";d.innerHTML="🤖 <b>Français AI</b><div class='note'>✅ الكتابة والإرسال يعملان.<br>المستوى: <b>"+level+"</b><br>هذه رسالة اختبار وليست إجابة ذكاء اصطناعي بعد.</div>";chat.appendChild(d);chat.scrollTop=chat.scrollHeight},200)}document.getElementById("send").onclick=send;inp.onkeydown=e=>{if(e.key==="Enter")send()};document.getElementById("mic").onclick=()=>{let S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){alert("التعرف الصوتي غير مدعوم.");return}let r=new S();r.lang="fr-FR";r.onresult=e=>inp.value=e.results[0][0].transcript;r.start()};</script></body></html>
