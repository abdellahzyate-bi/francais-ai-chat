<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Français AI Chat</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f6fb}
.app{width:min(900px,100%);margin:20px auto;padding:12px}
.head{background:linear-gradient(135deg,#241c68,#7137cf);color:#fff;padding:26px 16px;text-align:center;border-radius:22px 22px 0 0}
.head h1{margin:0 0 10px}.head p{margin:0}
.levels{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;padding:14px;border:1px solid #e5e7eb}
.level,.action{padding:11px 15px;border-radius:12px;border:1px solid #d7d9df;background:#fff;font-weight:700;cursor:pointer}
.level.active,.send{background:#5139c6;color:#fff;border-color:#5139c6}
.chat{height:420px;overflow-y:auto;padding:16px;background:#f8f9fc;border:1px solid #e5e7eb}
.msg{max-width:88%;padding:13px;margin:10px 0;border-radius:15px;line-height:1.7}
.ai{background:#fff}
.user{background:#5139c6;color:#fff;margin-right:auto;direction:ltr;text-align:left}
.note{background:#fff7ed;color:#333;padding:10px;margin-top:8px;border-radius:9px}
.composer{position:sticky;bottom:0;z-index:10;display:flex;gap:8px;align-items:center;background:#fff;padding:12px;border:1px solid #e5e7eb;box-shadow:0 -5px 18px rgba(0,0,0,.07)}
#text{display:block;flex:1;min-width:0;height:48px;padding:0 14px;border:2px solid #b9bdc8;border-radius:12px;background:#fff;color:#111;font-size:16px;direction:ltr;text-align:left;outline:none}
#text:focus{border-color:#5139c6}
.action{height:48px;white-space:nowrap}
.status{text-align:center;padding:10px;color:#667085;font-size:13px;background:#fff;border-radius:0 0 18px 18px}
@media(max-width:600px){
 .app{margin:0;padding:0}
 .head{border-radius:0;padding:22px 12px}
 .chat{height:55vh;min-height:300px}
 .composer{padding:9px 7px}
 .action{padding:10px 12px}
 #text{font-size:16px}
 .status{border-radius:0}
}
</style>
</head>
<body>
<main class="app">
 <header class="head"><h1>🤖 Français AI</h1><p>تحدث بالفرنسية وطوّر مستواك</p></header>
 <div class="levels">
  <span>مستواي:</span>
  <button class="level active" data-l="A1">A1</button>
  <button class="level" data-l="A2">A2</button>
  <button class="level" data-l="B1">B1</button>
  <button class="level" data-l="B2">B2</button>
  <button class="level" data-l="C1">C1</button>
 </div>
 <section id="chat" class="chat">
  <div class="msg ai">🇫🇷 <b>Bonjour ! 👋</b><br>Écris-moi une phrase en français.
   <div class="note">🇦🇪 اكتب جملة بالفرنسية لتجربة الكتابة والإرسال.</div>
  </div>
 </section>
 <div class="composer">
  <button id="mic" class="action" type="button" aria-label="Microphone">🎤</button>
  <input id="text" type="text" autocomplete="off" inputmode="text" placeholder="Écrivez votre message en français...">
  <button id="send" class="action send" type="button">إرسال ➤</button>
 </div>
 <div class="status">نسخة اختبار للواجهة — الذكاء الاصطناعي الحقيقي سيُربط لاحقًا عبر خادم آمن.</div>
</main>
<script>
let level="A1";
const chat=document.getElementById("chat");
const inp=document.getElementById("text");
document.querySelectorAll(".level").forEach(b=>{
 b.addEventListener("click",()=>{
  document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); level=b.dataset.l; inp.focus();
 });
});
function add(t,c){
 const d=document.createElement("div");
 d.className="msg "+c;
 d.textContent=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}
function send(){
 const t=inp.value.trim();
 if(!t){inp.focus();return;}
 add(t,"user"); inp.value="";
 setTimeout(()=>{
  const d=document.createElement("div");
  d.className="msg ai";
  d.innerHTML="🤖 <b>Français AI</b><div class='note'>✅ الكتابة والإرسال يعملان.<br>المستوى: <b>"+level+"</b><br>هذه رسالة اختبار وليست إجابة ذكاء اصطناعي بعد.</div>";
  chat.appendChild(d); chat.scrollTop=chat.scrollHeight;
 },150);
 inp.focus();
}
document.getElementById("send").addEventListener("click",send);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();send();}});
document.getElementById("mic").addEventListener("click",()=>{
 const S=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!S){alert("التعرف الصوتي غير مدعوم في هذا المتصفح.");return;}
 const r=new S(); r.lang="fr-FR";
 r.onresult=e=>{inp.value=e.results[0][0].transcript;inp.focus();};
 r.onerror=()=>alert("تعذر تشغيل الميكروفون. تحقق من إذن الميكروفون.");
 r.start();
});
</script>
</body>
</html>
