<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Français AI Chat</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f6fb}.app{width:min(900px,100%);margin:20px auto;padding:12px}.head{background:linear-gradient(135deg,#241c68,#7137cf);color:#fff;padding:26px 16px;text-align:center;border-radius:22px 22px 0 0}.head h1{margin:0 0 10px}.levels{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;background:#fff;padding:14px;border:1px solid #e5e7eb}.level,.action{padding:11px 15px;border-radius:12px;border:1px solid #d7d9df;background:#fff;font-weight:700;cursor:pointer}.level.active,.send{background:#5139c6;color:#fff;border-color:#5139c6}.chat{height:440px;overflow-y:auto;padding:16px;background:#f8f9fc;border:1px solid #e5e7eb}.msg{max-width:88%;padding:14px;margin:10px 0;border-radius:15px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.ai{background:#fff;border:1px solid #eceef3}.user{background:#5139c6;color:#fff;margin-right:auto;direction:ltr;text-align:left}.note{background:#fff7ed;color:#333;padding:10px;margin-top:8px;border-radius:9px}.ai-tools{display:flex;gap:8px;margin-top:10px}.speak{border:1px solid #ddd;background:#f8f8fb;border-radius:10px;padding:7px 10px;cursor:pointer}.composer{position:sticky;bottom:0;z-index:10;display:flex;gap:8px;align-items:center;background:#fff;padding:12px;border:1px solid #e5e7eb;box-shadow:0 -5px 18px rgba(0,0,0,.07)}#text{flex:1;min-width:0;height:48px;padding:0 14px;border:2px solid #b9bdc8;border-radius:12px;font-size:16px;direction:ltr;text-align:left;outline:none}#text:focus{border-color:#5139c6}.action{height:48px}.status{text-align:center;padding:11px;color:#667085;font-size:13px;background:#fff;border-radius:0 0 18px 18px}@media(max-width:600px){.app{margin:0;padding:0}.head{border-radius:0}.chat{height:55vh;min-height:320px}.composer{padding:9px 7px}.status{border-radius:0}}</style></head><body><main class="app">
<header class="head"><h1>🤖 Français AI</h1><p>تحدث بالفرنسية، صحّح أخطاءك وطوّر مستواك</p></header>
<div class="levels"><span>مستواي:</span><button class="level active" data-l="A1">A1</button><button class="level" data-l="A2">A2</button><button class="level" data-l="B1">B1</button><button class="level" data-l="B2">B2</button><button class="level" data-l="C1">C1</button></div>
<section id="chat" class="chat"><div class="msg ai">🇫🇷 Bonjour ! 👋
Écris-moi une phrase en français.<div class="note">🇦🇪 اكتب جملة بالفرنسية، وسأساعدك على تصحيحها وفهم الخطأ.</div></div></section>
<div class="composer"><button id="mic" class="action" type="button">🎤</button><input id="text" type="text" autocomplete="off" placeholder="Écrivez votre message en français..."><button id="send" class="action send" type="button">إرسال ➤</button></div>
<div class="status">🤖 Français AI — مدرسك الشخصي لتعلّم الفرنسية</div></main><script>
let level="A1";const API_URL="https://francais-ai-backend.vercel.app/api/chat",chat=document.getElementById("chat"),inp=document.getElementById("text"),sendBtn=document.getElementById("send");
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{document.querySelectorAll(".level").forEach(x=>x.classList.remove("active"));b.classList.add("active");level=b.dataset.l;inp.focus()});
function add(t,c){const d=document.createElement("div");d.className="msg "+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function cleanMarkdown(t){return String(t||"").replace(/\*\*(.*?)\*\*/gs,"$1").replace(/__(.*?)__/gs,"$1").replace(/^\s*#{1,6}\s*/gm,"").replace(/`([^`]+)`/g,"$1").trim()}
function frenchForSpeech(t){return cleanMarkdown(t).split("\n").filter(x=>!/[\u0600-\u06FF]/.test(x)).join(" ").replace(/[✅🇫🇷🇦🇪🤖]/g," ").replace(/\s+/g," ").trim()}
function speakFrench(t){if(!("speechSynthesis" in window)){alert("النطق غير مدعوم.");return}speechSynthesis.cancel();const s=frenchForSpeech(t);if(!s){alert("لا يوجد نص فرنسي للنطق.");return}const u=new SpeechSynthesisUtterance(s);u.lang="fr-FR";u.rate=.92;speechSynthesis.speak(u)}
function addAIReply(raw){const cleaned=cleanMarkdown(raw||"Aucune réponse."),box=document.createElement("div");box.className="msg ai";const text=document.createElement("div");text.textContent=cleaned;text.style.whiteSpace="pre-wrap";text.style.unicodeBidi="plaintext";text.style.textAlign="start";box.appendChild(text);const tools=document.createElement("div");tools.className="ai-tools";const speak=document.createElement("button");speak.type="button";speak.className="speak";speak.textContent="🔊 نطق الفرنسية";speak.onclick=()=>speakFrench(cleaned);tools.appendChild(speak);box.appendChild(tools);chat.appendChild(box);chat.scrollTop=chat.scrollHeight}
async function send(){const t=inp.value.trim();if(!t){inp.focus();return}add(t,"user");inp.value="";sendBtn.disabled=true;const waiting=add("🤖 Français AI réfléchit...","ai");try{const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t,level})});const data=await response.json();waiting.remove();if(!response.ok)throw new Error(data.error||"API error");addAIReply(data.reply)}catch(e){waiting.remove();add("⚠️ تعذر الاتصال بالمدرس الذكي.\nيرجى المحاولة مرة أخرى.","ai");console.error(e)}finally{sendBtn.disabled=false;inp.focus()}}
sendBtn.onclick=send;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();send()}};
document.getElementById("mic").onclick=()=>{const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S){alert("التعرف الصوتي غير مدعوم.");return}const r=new S();r.lang="fr-FR";r.onresult=e=>{inp.value=e.results[0][0].transcript;inp.focus()};r.onerror=()=>alert("تعذر تشغيل الميكروفون. تحقق من الإذن.");r.start()};
</script></body></html>
